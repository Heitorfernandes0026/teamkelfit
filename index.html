<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect to external origins for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Optimized font loading with display=swap for better LCP -->
    <link 
      rel="preload" 
      as="style" 
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" 
    />

      rel="stylesheet" 
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" 
      media="print" 
      onload="this.media='all'" 
    />
    <noscript>
      <link 
        rel="stylesheet" 
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" 
      />
    </noscript>
    
    <!-- SEO and meta tags -->
    <title>Team KelFit - Consultoria Fitness Premium</title>
    <meta name="description" content="Consultoria fitness personalizada com Kesley. Protocolos 100% individuais, análise técnica de movimentos e suporte direto via WhatsApp. Transforme seu corpo com resultados reais." />
    <meta name="author" content="Team KelFit" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph -->
    <meta property="og:title" content="Team KelFit - Consultoria Fitness Premium" />
    <meta property="og:description" content="Protocolos 100% individuais com análise técnica de movimentos e suporte direto via WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Team KelFit - Consultoria Fitness Premium" />
    <meta name="twitter:description" content="Protocolos 100% individuais com análise técnica de movimentos e suporte direto via WhatsApp." />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
